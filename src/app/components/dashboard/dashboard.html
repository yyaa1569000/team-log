<div class="dashboard-layout">
  <!-- 側邊欄 -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>{{ settingsService.settings().workspaceName }}</h2>
    </div>
    
    <nav class="sidebar-nav">
      <!-- 💡 點總覽回到 /dashboard -->
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">📊 總覽</a>
      <a routerLink="logs" routerLinkActive="active">📝 工作日誌</a>
      <a routerLink="team" routerLinkActive="active">👥 團隊成員</a>
      <a routerLink="settings" routerLinkActive="active">⚙️ 系統設定</a>
    </nav>

    <button class="btn-logout" (click)="logout()">🚪 登出</button>
  </aside>

  <!-- 主內容區 -->
  <main class="main-content">
    @if (isOverview) {
      <!-- 你的原本總覽面板，完全不動它 -->
      <div class="overview-panel">
        <h3>今日日誌數：{{ todayLogsCount() }}</h3>
        <!-- 最新日誌列表 -->
      </div>
    } @else {
      <!-- 其他子路由頁面渲染在這裡 -->
      <router-outlet></router-outlet>
    }
  </main>
</div>
