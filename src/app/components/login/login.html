<div class="login-container">
  <div class="login-card">
    <div class="logo-area">
      <h2>TeamLog</h2>
      <p class="subtitle">團隊協作與日誌管理系統</p>
    </div>

    @if (errorMessage()) {
      <div
        style="
          color: #e53e3e;
          background: #fff5f5;
          padding: 10px;
          border-radius: 6px;
          margin-bottom: 15px;
          font-size: 14px;
          text-align: center;
        "
      >
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="username">帳號</label>
        <input
          type="text"
          id="username"
          placeholder="請輸入帳號"
          [value]="username()"
          (input)="username.set($any($event.target).value)"
        />
      </div>

      <div class="form-group">
        <label for="password">密碼</label>
        <input
          type="password"
          id="password"
          placeholder="請輸入密碼"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
        />
      </div>

      <div class="form-actions">
        <!-- 💡 綁定記住我狀態 -->
        <label class="remember-me">
          <input 
            type="checkbox" 
            [ngModel]="rememberMe()" 
            (ngModelChange)="rememberMe.set($event)" 
            name="rememberMe" 
          /> 記住帳號
        </label>
        <a href="#" class="forgot-password">忘記密碼？</a>
      </div>

      <button type="submit" class="btn-submit">登入</button>
    </form>
    
    <div class="demo-credentials-hint">
      <div class="hint-content">
        <div 
          class="copyable-row" 
          (click)="copyToClipboard('dragon', 'username', $event)"
          title="點擊複製管理員帳號"
        >
          <span>管理員帳號：<code>dragon</code></span>
          @if (copiedField() === 'username') {
            <span class="copied-tip">（已複製！）</span>
          }
        </div>
        <div 
          class="copyable-row" 
          (click)="copyToClipboard('dragon7788', 'password', $event)"
          title="點擊複製密碼"
        >
          <span>密碼：<code>dragon7788</code></span>
          @if (copiedField() === 'password') {
            <span class="copied-tip">（已複製！）</span>
          }
        </div>
      </div>
    </div>
  </div>
</div>
